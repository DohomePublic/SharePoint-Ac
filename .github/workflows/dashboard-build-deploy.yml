name: Dashboard - ดึงข้อมูล & Deploy

# ==================================================================
#  ดึงข้อมูลจาก SharePoint List อัตโนมัติ แล้ว commit dashboard/data.json
#  + dashboard/index.html กลับเข้า repo และ deploy ขึ้น GitHub Pages
#
#  ทำงาน 4 กรณี
#   1) schedule  : ทุก 30 นาที ช่วง 01:00-13:30 UTC จ.-ส. (08:00-20:30 ไทย)
#                  + รอบเที่ยงคืนไทยอีก 1 รอบ (17:00 UTC ทุกวัน)
#   2) push      : แก้ template หรือ build script -> build ใหม่ทันที
#   3) manual    : กด Run workflow เอง (มีตัวเลือก force / skip)
#   4) ถูกเรียกจาก workflow อื่น (workflow_call)
#
#  ต้องตั้งค่าก่อนใช้งาน:
#   Settings > Secrets and variables > Actions > New repository secret
#     AZURE_TENANT_ID / AZURE_CLIENT_ID / AZURE_CLIENT_SECRET
#   Settings > Actions > General > Workflow permissions = Read and write
#   Settings > Pages > Source = GitHub Actions   (เฉพาะถ้าจะใช้ Pages)
# ==================================================================

on:
  schedule:
    # หมายเหตุ: cron ของ GitHub เป็น UTC เสมอ (ไทย = UTC+7)
    - cron: '0,30 1-13 * * 1-6'   # 08:00-20:30 น. ไทย ทุก 30 นาที จันทร์-เสาร์
    - cron: '0 17 * * *'          # 00:00 น. ไทย ทุกวัน (รอบปิดวัน)
  push:
    branches: [main]
    paths:
      - 'dashboard/template.html'
      - 'scripts/build-snapshot.mjs'
      - '.github/workflows/dashboard-build-deploy.yml'
  workflow_dispatch:
    inputs:
      skip_refresh:
        description: 'ไม่ต้องดึงข้อมูลใหม่ (build จาก data.json เดิม)'
        type: boolean
        default: false
      force:
        description: 'ข้าม safety guard (ใช้เมื่อจำนวนแถวลดลงจริง เช่น มีการล้างข้อมูล)'
        type: boolean
        default: false
      deploy_pages:
        description: 'Deploy ขึ้น GitHub Pages ด้วย'
        type: boolean
        default: true
  workflow_call:

permissions:
  contents: write        # commit data.json / index.html กลับเข้า repo
  pages: write
  id-token: write

concurrency:
  group: dashboard-refresh
  cancel-in-progress: false   # ห้าม cancel กลางคัน เพราะมีขั้นตอน git push

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    outputs:
      rows:    ${{ steps.build.outputs.rows }}
      changed: ${{ steps.commit.outputs.changed }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: ตรวจว่าไฟล์ที่จำเป็นถูกอัปขึ้น repo ครบหรือยัง
        run: |
          MISSING=""
          for f in scripts/build-snapshot.mjs \
                   scripts/rebuild-from-data.mjs \
                   dashboard/template.html ; do
            [ -f "$f" ] || MISSING="$MISSING\n  - $f"
          done
          if [ -n "$MISSING" ]; then
            {
              echo "## ❌ ไฟล์ไม่ครบ — workflow หยุดทำงาน"
              echo ""
              echo "ไฟล์ที่หายไปจาก repo:"
              echo ""
              printf "%b\n" "$MISSING"
              echo ""
              echo "**สาเหตุ:** อัปเฉพาะโฟลเดอร์ \`.github/workflows/\` ขึ้นมา แต่ยังไม่ได้อัปโฟลเดอร์ \`scripts/\` และ \`dashboard/\`"
              echo ""
              echo "**วิธีแก้:** เปิด repo → **Add file → Upload files** → ลากโฟลเดอร์ \`scripts\` และ \`dashboard\` จากไฟล์ zip มาวาง → Commit"
              echo ""
              echo "สิ่งที่ repo มีอยู่ตอนนี้:"
              echo '```'
              ls -R . | head -60
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            printf "::error::ไฟล์ไม่ครบ:%b\n" "$MISSING"
            exit 1
          fi
          echo "✅ ไฟล์ครบ"
          test -f dashboard/data.json || echo "::warning::ยังไม่มี dashboard/data.json (ปกติถ้าเป็นรอบแรก และมี AZURE_* secrets)"

      - name: ตรวจว่ามี Secrets ครบหรือยัง
        id: pre
        env:
          T: ${{ secrets.AZURE_TENANT_ID }}
          C: ${{ secrets.AZURE_CLIENT_ID }}
          S: ${{ secrets.AZURE_CLIENT_SECRET }}
        run: |
          if [ -z "$T" ] || [ -z "$C" ] || [ -z "$S" ]; then
            echo "has_secrets=false" >> "$GITHUB_OUTPUT"
            echo "::warning::ยังไม่ได้ตั้ง AZURE_* secrets — ข้ามการดึงข้อมูล จะ build จาก data.json เดิมแทน"
          else
            echo "has_secrets=true" >> "$GITHUB_OUTPUT"
          fi

      - name: ดึงข้อมูลจาก SharePoint (Microsoft Graph) แล้ว build
        id: build
        if: ${{ steps.pre.outputs.has_secrets == 'true' && inputs.skip_refresh != true }}
        env:
          AZURE_TENANT_ID:     ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID:     ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          SP_HOSTNAME:   dohomegroup.sharepoint.com
          SP_SITE_PATH:  /sites/AC-Accounting
          SP_LIST_TITLE: 'AC-Data Request for approval of PO'
          FORCE_BUILD:   ${{ inputs.force }}
        run: |
          node scripts/build-snapshot.mjs
          echo "rows=$(node -p "require('./dashboard/build-report.json').rows")" >> "$GITHUB_OUTPUT"

      - name: build ใหม่จากข้อมูลเดิม (กรณีข้าม refresh หรือไม่มี secrets)
        if: ${{ steps.pre.outputs.has_secrets != 'true' || inputs.skip_refresh == true }}
        run: node scripts/rebuild-from-data.mjs

      - name: ตรวจสอบผลลัพธ์ก่อน deploy
        run: |
          set -e
          test -s dashboard/index.html
          test -s dashboard/data.json
          node -e "
            const j=require('./dashboard/data.json');
            if(!j.data||!j.data.n) throw new Error('data.json ว่าง');
            console.log('data.json OK rows =', j.data.n, '| builtAt =', j.builtAt);
          "
          node -e "
            const fs=require('fs');
            const h=fs.readFileSync('dashboard/index.html','utf8');
            const iData=h.indexOf('id=\"snap\"'), iUse=h.indexOf('function loadSnapshot');
            if(iData<0) throw new Error('ไม่พบบล็อกข้อมูล #snap');
            if(iUse<0)  throw new Error('ไม่พบ loadSnapshot');
            if(iData>iUse) throw new Error('บล็อกข้อมูลอยู่หลังสคริปต์หลัก จะทำให้ข้อมูลไม่แสดง');
            const j=JSON.parse(h.match(/id=\"snap\">([\s\S]*?)<\/script>/)[1]);
            if(!j.n || j.n<1) throw new Error('snapshot ว่าง');
            console.log('index.html OK rows =', j.n);
          "

      - name: สรุปผลลง Job Summary
        if: always()
        run: |
          if [ -f dashboard/build-report.json ]; then
            node -e "
              const r=require('./dashboard/build-report.json');
              const L=[];
              L.push('## 📊 ผลการดึงข้อมูล PO Approval Dashboard','');
              L.push('| รายการ | ค่า |','|---|---|');
              L.push('| แหล่งข้อมูล | '+(r.source==='graph'?'SharePoint (Microsoft Graph)':'CSV')+' |');
              L.push('| จำนวนรายการ | **'+r.rows.toLocaleString()+'** |');
              L.push('| เทียบครั้งก่อน | '+r.previousRows.toLocaleString()+' → '+r.rows.toLocaleString()+' ('+(r.delta>=0?'+':'')+r.delta+') |');
              L.push('| รายการใหม่สุด | '+r.latestCreatedBkk+' น. (เวลาไทย) · เลขที่คำขอ '+r.latestTitle+' · ID '+r.latestId+' |');
              L.push('| วันล่าสุดที่มีคำขอ | '+r.lastDay+' จำนวน '+r.lastDayCount+' รายการ |');
              L.push('| ใช้เวลา | '+r.tookSec+' วินาที |');
              L.push('| ขนาด index.html | '+r.htmlBytes.toLocaleString()+' bytes |');
              L.push('| ขนาด data.json | '+r.dataBytes.toLocaleString()+' bytes |');
              L.push('','### แยกตามสถานะ','','| สถานะ | จำนวน | สัดส่วน |','|---|---:|---:|');
              for(const [k,v] of r.byStatus) L.push('| '+k+' | '+v.toLocaleString()+' | '+(v*100/r.rows).toFixed(1)+'% |');
              require('fs').appendFileSync(process.env.GITHUB_STEP_SUMMARY, L.join('\n')+'\n');
            "
          else
            echo '⚠️ ไม่มี build-report.json (การดึงข้อมูลอาจล้มเหลว)' >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Commit กลับเข้า repo
        id: commit
        run: |
          git config user.name  'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add dashboard/index.html dashboard/data.json dashboard/build-report.json
          if git diff --staged --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "ℹ️ ข้อมูลไม่เปลี่ยนแปลง — ไม่ต้อง commit"
          else
            ROWS=$(node -p "require('./dashboard/build-report.json').rows" 2>/dev/null || echo '?')
            git commit -m "chore(dashboard): refresh snapshot ${ROWS} รายการ [skip ci]"
            # กันกรณีมี commit อื่นแทรกระหว่างที่ workflow ทำงาน
            for i in 1 2 3; do
              git pull --rebase --autostash origin "${GITHUB_REF_NAME}" && git push && break
              echo "↻ push ไม่สำเร็จ ลองใหม่ครั้งที่ $i"; sleep 5
            done
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: เก็บไฟล์เป็น artifact (ดาวน์โหลดได้จากหน้า run)
        uses: actions/upload-artifact@v4
        with:
          name: po-approval-dashboard
          path: |
            dashboard/index.html
            dashboard/data.json
            dashboard/build-report.json
          retention-days: 30

      - uses: actions/configure-pages@v5
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.deploy_pages }}
      - uses: actions/upload-pages-artifact@v3
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.deploy_pages }}
        with:
          path: dashboard

  deploy-pages:
    needs: refresh
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.deploy_pages }}
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

      - name: แสดงลิงก์แดชบอร์ด
        run: |
          U='${{ steps.deployment.outputs.page_url }}'
          {
            echo "## 🌐 แดชบอร์ดออนไลน์แล้ว"
            echo ""
            echo "เปิดใช้งานที่: **${U}**"
            echo ""
            echo "> ถ้าเปิดแล้วขึ้น 404 ให้ไปที่ **Settings → Pages → Build and deployment → Source** แล้วเลือก **GitHub Actions** (ไม่ใช่ Deploy from a branch)"
          } >> "$GITHUB_STEP_SUMMARY"

  # เปิด Issue อัตโนมัติเมื่อการดึงข้อมูลล้มเหลว (เฉพาะรอบ schedule จะได้ไม่พลาด)
  notify-failure:
    needs: refresh
    if: ${{ failure() && github.event_name == 'schedule' }}
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const title = '⚠️ Dashboard refresh ล้มเหลว';
            const url = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const list = await github.rest.issues.listForRepo({
              ...context.repo, state: 'open', labels: 'dashboard-refresh' });
            const body = `การดึงข้อมูลจาก SharePoint ล้มเหลวเมื่อ ${new Date().toISOString()}\n\nดูรายละเอียด: ${url}\n\n` +
              `จุดที่ควรตรวจสอบ:\n- AZURE_TENANT_ID / AZURE_CLIENT_ID / AZURE_CLIENT_SECRET หมดอายุหรือไม่\n` +
              `- สิทธิ์ Graph \`Sites.Selected\` ยังถูกต้องหรือไม่\n- ชื่อ List เปลี่ยนหรือไม่`;
            if (list.data.length) {
              await github.rest.issues.createComment({ ...context.repo, issue_number: list.data[0].number, body });
            } else {
              await github.rest.issues.create({ ...context.repo, title, body, labels: ['dashboard-refresh'] });
            }
