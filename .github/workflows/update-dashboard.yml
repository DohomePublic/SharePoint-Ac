      - name: Commit & push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add index.html

          if git diff --staged --quiet; then
            echo "ℹ️ ข้อมูลไม่เปลี่ยนแปลง — ไม่ต้อง commit"
            echo "### ℹ️ ข้อมูลไม่เปลี่ยนแปลง" >> $GITHUB_STEP_SUMMARY
          else
            STAMP="$(date '+%d/%m/%Y %H:%M น.')"

            git commit -m "chore: update dashboard $STAMP (ICT)"
            git push

            echo "✅ อัปเดต dashboard แล้ว: $STAMP"

            {
              echo "### ✅ อัปเดต Dashboard สำเร็จ"
              echo "- เวลา (ไทย): $STAMP"
              echo "- ขนาดไฟล์: $(du -h index.html | cut -f1)"
              echo "- เว็บไซต์: https://dohomepublic.github.io/sharepoint-web/"
              echo "- Repository: https://github.com/DohomePublic/SharePoint-Ac"
            } >> $GITHUB_STEP_SUMMARY
          fi
``
