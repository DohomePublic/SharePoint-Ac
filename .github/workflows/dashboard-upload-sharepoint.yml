name: Dashboard - Upload to SharePoint SiteAssets

# อัปโหลด dashboard/index.html ขึ้น SharePoint SiteAssets อัตโนมัติ
# เมื่อไฟล์ถูก build ใหม่ (โหมด LIVE จะทำงานเมื่อเปิดจาก URL ของ SharePoint)
on:
  workflow_run:
    workflows: ['Dashboard - Build & Deploy']
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  upload:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Upload ผ่าน Microsoft Graph
        env:
          AZURE_TENANT_ID:     ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID:     ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          SP_HOSTNAME:  dohomegroup.sharepoint.com
          SP_SITE_PATH: /sites/AC-Accounting
          TARGET_PATH:  'SiteAssets/po-approval-dashboard.html'
        run: |
          node -e "
          const fs=require('fs');
          (async()=>{
            const b=new URLSearchParams({client_id:process.env.AZURE_CLIENT_ID,
              client_secret:process.env.AZURE_CLIENT_SECRET,
              scope:'https://graph.microsoft.com/.default',grant_type:'client_credentials'});
            const tr=await fetch('https://login.microsoftonline.com/'+process.env.AZURE_TENANT_ID+'/oauth2/v2.0/token',{method:'POST',body:b});
            if(!tr.ok) throw new Error('token '+tr.status+' '+await tr.text());
            const tk=(await tr.json()).access_token;
            const sr=await fetch('https://graph.microsoft.com/v1.0/sites/'+process.env.SP_HOSTNAME+':'+process.env.SP_SITE_PATH,{headers:{Authorization:'Bearer '+tk}});
            if(!sr.ok) throw new Error('site '+sr.status+' '+await sr.text());
            const site=await sr.json();
            const data=fs.readFileSync('dashboard/index.html');
            const url='https://graph.microsoft.com/v1.0/sites/'+site.id+'/drive/root:/'+process.env.TARGET_PATH+':/content';
            const ur=await fetch(url,{method:'PUT',headers:{Authorization:'Bearer '+tk,'Content-Type':'text/html'},body:data});
            if(!ur.ok) throw new Error('upload '+ur.status+' '+await ur.text());
            const j=await ur.json();
            console.log('✔ อัปโหลดสำเร็จ:', j.webUrl, (data.length/1e6).toFixed(2)+' MB');
          })().catch(e=>{console.error('✖',e.message);process.exit(1);});
          "
